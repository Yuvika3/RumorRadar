version: '3.8'

services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./datasets:/datasets
      - ./ml-service/saved_models:/app/saved_models
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATASETS_DIR=/datasets
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./datasets:/datasets
      - ./backend/.data:/app/.data
      - ./backend/uploads:/app/uploads
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ML_SERVICE_URL=http://ml-service:8000
      - DATASETS_DIR=/datasets
      - STORAGE_FALLBACK=true
    depends_on:
      - ml-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

