services:
  # 1. Python ML FastAPI Engine
  - type: web
    name: rumorradar-ml
    runtime: python
    plan: free
    buildCommand: "cd ml-service && pip install -r requirements.txt"
    startCommand: "cd ml-service && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATASETS_DIR
        value: ../datasets

  # 2. Express TypeScript Backend API
  - type: web
    name: rumorradar-backend
    runtime: node
    plan: free
    buildCommand: "cd backend && npm install && npm run build"
    startCommand: "cd backend && npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: STORAGE_FALLBACK
        value: "true"
      - key: DATASETS_DIR
        value: ../datasets
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: rumorradar-ml
          property: host

  # 3. React Vite Frontend (Static Site)
  - type: web
    name: rumorradar-frontend
    runtime: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
